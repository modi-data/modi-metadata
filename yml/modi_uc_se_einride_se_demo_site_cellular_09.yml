# 5.3.2 Structural metadata
structural:
  summary: Single CSV file.
  file_format: csv with ',' as delimiter, '.' as decimal separator.
  file_structure: Single CSV file with header row. Each row represents one measurement from one device.
  required_tools: CSV parser (Excel, Python, R, etc.)
  tool_versions: N/A

# 5.3.1 Descriptive metadata
descriptive:
  fields:
    receive_time:
      description: Measurement timestamp.
      timezone: UTC
      type: datetime
      time_format: "ISO 8601 (YYYY-MM-DD HH:MM:SS.ffffff UTC)"
      range: 2025-09-01 07:07:04 to 2025-09-05 12:51:36 UTC
      availability: Always present

    serial_number:
      description: Modem serial number.
      type: string
      availability: Always present

    network_type:
      description: Cellular network type (3G, 4G LTE, 5G).
      type: integer or string
      availability: Null in this dataset

    cellular_id:
      description: Cellular connection identifier.
      type: integer
      availability: Value "1" when present

    imei:
      description: International Mobile Equipment Identity.
      type: string
      availability: Not available

    rssi_dbm:
      description: Received Signal Strength Indicator. Higher values (closer to 0) = stronger signal. Typical range -120 to -30 dBm.
      unit: dBm
      type: float
      availability: Not available

    snr_db:
      description: Signal-to-Noise Ratio. Values > 0 dB indicate more signal than noise.
      unit: dB
      type: float
      availability: Not available

    sinr_db:
      description: Signal-to-Interference-plus-Noise Ratio.
      unit: dB
      type: float
      availability: Not available

    ecio_db:
      description: Ec/Io ratio - signal quality measure for CDMA/WCDMA networks.
      unit: dB
      type: float
      availability: Not available

    rsrp_dbm:
      description: Reference Signal Received Power. Higher values (closer to 0) = stronger signal. Typical range -140 to -40 dBm.
      unit: dBm
      type: float
      availability: Not available

    rsrq_db:
      description: Reference Signal Received Quality. Higher (less negative) values = better quality. Typical range -20 to -3 dB.
      unit: dB
      type: float
      availability: Not available

    band_frequency_mhz:
      description: Cellular frequency band.
      unit: MHz
      type: float
      availability: Not available

    lac:
      description: Location Area Code (GSM/UMTS).
      type: integer
      availability: Not available

    tac:
      description: Tracking Area Code (LTE).
      type: integer
      availability: Not available

    enodeb_id:
      description: LTE base station identifier.
      type: integer
      availability: Not available

    rscp_dbm:
      description: Received Signal Code Power (UMTS/3G).
      unit: dBm
      type: float
      availability: Not available

    band:
      description: Cellular frequency band identifier.
      type: string or integer
      availability: Not available

    channel:
      description: Channel number within frequency band.
      type: integer
      availability: Not available

    vplmn:
      description: Visited Public Land Mobile Network.
      type: string
      availability: Not available

    roaming:
      description: Roaming status indicator.
      type: boolean or string
      availability: Not available

    iccid:
      description: SIM card identifier.
      type: string
      availability: Not available

    imsi:
      description: International Mobile Subscriber Identity.
      type: string
      availability: Not available

    cell_id:
      description: Cell tower identifier.
      type: string or integer
      availability: Not available

    apn:
      description: Access Point Name.
      type: string
      availability: Not available

    signal_bars:
      description: Signal strength indicator (0-5 bars).
      type: integer
      range: 0-5
      availability: Not available

    rx_bytes:
      description: Bytes received by modem.
      unit: bytes
      type: integer
      availability: "Available (value: 95280)"

    tx_bytes:
      description: Bytes transmitted by modem.
      unit: bytes
      type: integer
      availability: Not available

    rx_errors:
      description: Receive error count.
      type: integer
      availability: Not available

    tx_errors:
      description: Transmit error count.
      type: integer
      availability: Not available
