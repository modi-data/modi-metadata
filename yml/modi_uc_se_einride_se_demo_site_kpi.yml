# 5.3.2 Structural metadata
structural:
  summary: |
    The dataset consists of monthly operational KPIs organized in a time-series format with
    10 months of data (December 2024 - September 2025). Each row represents a different
    operational metric, and each column represents a month. The metrics cover transport volume,
    delivery performance, operational efficiency, and system availability.

  # File format. Please include attributes such as delimiter for CSV, decimal separator,
  # thousand separator (if any), and any other properties that is relevant for parsing the data.
  file_format: |
    .xlsx (Microsoft Excel) file with standard formatting.

  # Please describe the storage structure of the data. If it consists of flat files, the folder
  # structure and file naming can be relevant. If it is a database, a description of the relevant
  # tables, indices, triggers and views is important.
  file_structure: |
    Single Excel file with tabular structure:
    - First row: Header with month labels (Dec-24, Jan-25, etc.)
    - First column: Metric names (objectives)
    - Data cells: Monthly values for each metric
    - 10 rows of metrics × 10 columns of months = 100 data points

  # Which tools can be used to read the data. Especially important for non-standard formats.
  required_tools: |
    Microsoft Excel, LibreOffice Calc, Google Sheets, or any spreadsheet software capable of
    reading .xlsx files. Python libraries such as pandas, openpyxl, or xlrd can also be used
    for programmatic access.

  # If the files were made using a specific tool, the tool name and version may be relevant
  # for reading the data.
  tool_versions: N/A

# 5.3.1 Descriptive metadata
descriptive:
  fields:
    Time_Period:
      description: Monthly time periods from December 2024 to September 2025
      time_format: MMM-YY (e.g., Dec-24, Jan-25)
      time_zone: CET (Central European Time)
      sample_rate: Monthly

    AET_tonne_km_per_month:
      description: Autonomous Electric Transport tonne-kilometers per month - primary measure of freight transport volume and efficiency
      unit: tonne-km
      type: calculated
      definition: Total tonnes transported multiplied by distance traveled
      data_precision: 1 decimal place
      quality: High - calculated from measured vehicle data
      availability: 100%

    Tonnes_transported:
      description: Total weight of goods transported per month
      unit: tonnes
      type: measured
      data_precision: 2 decimal places
      quality: High - measured from vehicle load sensors and logistics systems
      availability: 100%

    Delivery_Performance_OTIF:
      description: On-Time In-Full delivery performance percentage - key KPI for logistics reliability
      unit: percentage
      type: calculated
      definition: (Number of deliveries completed on-time and in-full / Total number of deliveries) × 100
      range: 0-100
      data_precision: 2 decimal places
      quality: High - tracked by logistics management system
      availability: 100%

    Shipments_Disturbed_Delayed:
      description: Number of shipments that experienced disruptions or delays during the month
      unit: count
      type: counted
      definition: Total shipments not meeting on-time delivery criteria
      range: 0 or positive integer
      quality: High - tracked by logistics management system
      availability: 100%

    Kilometer_driven:
      description: Total distance driven by autonomous vehicles per month
      unit: kilometers
      type: measured
      data_precision: 2 decimal places
      quality: High - measured from vehicle odometer and GPS data
      availability: 100%

    Average_load:
      description: Average load weight per trip - indicator of vehicle utilization efficiency
      unit: tonnes
      type: calculated
      definition: Total tonnes transported / Number of trips
      data_precision: 2 decimal places
      quality: High - calculated from measured values
      availability: 100%

    SLA_fulfilment:
      description: Service Level Agreement fulfilment percentage - contractual performance metric
      unit: percentage
      type: calculated
      definition: Percentage of shipments meeting all SLA requirements (time, condition, documentation)
      range: 0-100
      data_precision: 0 decimal places (whole percentages)
      quality: High - tracked by contract management system
      availability: 100%

    ODD_Weather_downtime:
      description: Operational Design Domain weather-related downtime - time when autonomous operations were suspended due to weather conditions exceeding ODD parameters
      unit: time (HH:MM:SS)
      type: measured
      definition: Total duration when operations were halted due to weather conditions outside the safe operational envelope (e.g., heavy snow, ice, poor visibility)
      time_format: HH:MM:SS
      quality: High - logged by vehicle systems and operations monitoring
      availability: 100%

    Units_transported:
      description: Number of individual units, packages, or pallets transported per month
      unit: count
      type: counted
      definition: Total number of discrete shipping units handled
      range: 0 or positive integer
      quality: High - tracked by logistics management system
      availability: 100%

    Accumulated_AET_tonne_km_per_month:
      description: Cumulative sum of AET tonne-kilometers from December 2024 baseline
      unit: tonne-km
      type: calculated
      definition: Running total of monthly AET tonne-km values since start of data collection
      data_precision: 1 decimal place
      quality: High - calculated from monthly AET tonne-km values
      availability: 100%
