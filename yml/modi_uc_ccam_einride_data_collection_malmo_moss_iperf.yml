summary:
  why_was_it_collected: To test GNSS and mobile network uplink connectivity in the MODI corridor between Malmö and Moss.
  how_was_the_collection_executed: Field test trial collecting several relevant parameters related to GNSS and mobile network uplink connectivity.
  objectives: Test GNSS and mobile network uplink connectivity in the MODI corridor between Malmö and Moss.

  experimental_plan: Measure both Telenor and Telia uplink throughput and latency throughout the route.
  research_questions: How is the GNSS and mobile network uplink connectivity in the MODI corridor between Malmö and Moss?
  sample_selection_criteria: N/A

  data_area: Norway and Sweden, from Malmö to Moss.
  modi_use_case: UCCCAM

  # A person that can be contacted for more information about this dataset.
  contact_person: Pia Wijk, pia.wijk@einride.tech
  producer_of_data: Einride
  web_address: N/A
  DOI: N/A

  # Which type of data this is.
  data_type: mobile network, gnss
  dataset_size: Approximately 42 MB (27k datapoints).
