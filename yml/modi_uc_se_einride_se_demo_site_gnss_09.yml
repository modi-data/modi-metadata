# 5.3.2 Structural metadata
structural:
  summary: Single CSV file.
  file_format: csv with ',' as delimiter, '.' as decimal separator.
  file_structure: Single CSV file with header row. Each row represents one measurement from one device.
  required_tools: CSV parser (Excel, Python, R, etc.)
  tool_versions: N/A

# 5.3.1 Descriptive metadata
descriptive:
  fields:
    id:
      description: Measurement ID.
      type: string
      availability: Mostly empty

    time:
      description: System timestamp when measurement was received.
      timezone: UTC
      type: datetime
      format: "YYYY-MM-DD HH:MM:SS.ffffff UTC"
      range: 2025-09-01 to 2025-09-05

    sensor_time:
      description: GNSS sensor timestamp.
      timezone: UTC
      type: datetime
      format: "YYYY-MM-DD HH:MM:SS.S UTC"

    reference_frame:
      description: Reference frame for GNSS measurements.
      type: string

    solution_type:
      description: GNSS solution type indicating positioning accuracy level.
      type: string
      availability: Always present

    latitude_degrees:
      description: WGS84 latitude.
      unit: degrees
      type: float
      srid: 4326
      availability: Always present

    longitude_degrees:
      description: WGS84 longitude.
      unit: degrees
      type: float
      srid: 4326
      availability: Always present

    heading_radians:
      description: Vehicle heading.
      unit: radians
      type: float
      availability: Mostly empty

    altitude_meters:
      description: Altitude above sea level.
      unit: meters
      type: float
      availability: Always present

    horizontal_accuracy_meters:
      description: Estimated horizontal positioning accuracy.
      definition: "Estimated 1-sigma horizontal position accuracy. Lower values indicate higher confidence in position."
      unit: meters
      type: float
      availability: Always present

    vertical_accuracy_meters:
      description: Estimated vertical positioning accuracy.
      definition: "Estimated 1-sigma vertical position accuracy. Lower values indicate higher confidence in altitude."
      unit: meters
      type: float
      availability: Always present

    hdop:
      description: Horizontal Dilution of Precision.
      definition: "Measures geometric quality of horizontal positioning. Lower values (<2) indicate better satellite geometry."
      type: float
      availability: Always present

    vdop:
      description: Vertical Dilution of Precision.
      definition: "Measures geometric quality of vertical positioning. Lower values (<3) indicate better satellite geometry."
      type: float
      availability: Always present

    pdop:
      description: Position Dilution of Precision.
      definition: "Combines horizontal and vertical DOP. Indicates overall 3D positioning quality. Lower values (<3) indicate better geometry."
      type: float
      availability: Always present

    tdop:
      description: Time Dilution of Precision.
      definition: "Measures geometric quality of time solution from satellite geometry."
      type: float
      availability: Always present

    gdop:
      description: Geometric Dilution of Precision.
      definition: "Overall measure of satellite geometry quality including position and time. Combines PDOP and TDOP."
      type: float
      availability: Always present

    visible_satellites_count:
      description: Number of visible satellites.
      type: integer
      availability: Always present

