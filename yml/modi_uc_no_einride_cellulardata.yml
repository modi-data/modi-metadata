# 5.3.2 Structural metadata
structural:
  summary: Single CSV file.
  file_format: csv with ',' as delimiter, '.' as decimal separator.
  file_structure: Single CSV file with header row. Each row represents one measurement from one device.
  required_tools: CSV parser (Excel, Python, R, etc.)
  tool_versions: N/A

# 5.3.1 Descriptive metadata
descriptive:
  fields:
    receive_time:
      description: Timestamp when the measurement was received
      time_format: ISO 8601 (YYYY-MM-DD HH:MM:SS.ffffff UTC)
      time_zone: UTC

    serial_number:
      description: Serial number of the cellular device
      type: String

    network_type:
      description: Type of cellular network connection

    cellular_id:
      description: Cellular interface identifier
      type: Integer

    imei:
      description: International Mobile Equipment Identity
      type: String (15 digits)

    rssi_dbm:
      description: Received Signal Strength Indicator
      unit: dBm
      availability: Always present

    snr_db:
      description: Signal-to-Noise Ratio
      unit: dB
      availability: May be empty

    sinr_db:
      description: Signal-to-Interference-plus-Noise Ratio
      unit: dB
      availability: May be empty

    ecio_db:
      description: Ec/Io (Energy per chip to Interference ratio, for CDMA/UMTS)
      unit: dB
      availability: May be empty

    rsrp_dbm:
      description: Reference Signal Received Power (for LTE/5G)
      unit: dBm
      availability: Present for LTE/5G connections

    rsrq_db:
      description: Reference Signal Received Quality (for LTE/5G)
      unit: dB
      availability: Present for LTE/5G connections

    band_frequency_mhz:
      description: Band frequency in MHz
      unit: MHz
      availability: May be empty

    lac:
      description: Location Area Code (for GSM/UMTS)
      type: Integer
      availability: May be empty

    tac:
      description: Tracking Area Code (for LTE/5G)
      type: Integer
      availability: May be empty

    enodeb_id:
      description: eNodeB identifier (for LTE)
      type: Integer
      availability: May be empty

    rscp_dbm:
      description: Received Signal Code Power (for UMTS)
      unit: dBm
      availability: May be empty

    band:
      description: Frequency band identifier
      type: String

    channel:
      description: Channel number
      type: Integer

    vplmn:
      description: Visited Public Land Mobile Network identifier
      type: String (format MCC-MNC)

    roaming:
      description: Roaming status
      type: String
      availability: May be empty

    iccid:
      description: Integrated Circuit Card Identifier (SIM card ID)
      type: String (up to 20 digits)

    imsi:
      description: International Mobile Subscriber Identity
      type: String (up to 15 digits)

    cell_id:
      description: Cell tower identifier
      type: Integer

    apn:
      description: Access Point Name
      type: String

    signal_bars:
      description: Signal strength indicator (display bars)
      type: Integer
      range: 1-5

    rx_bytes:
      description: Total received bytes (cumulative)
      unit: bytes
      type: Integer

    tx_bytes:
      description: Total transmitted bytes (cumulative)
      unit: bytes
      type: Integer

    rx_errors:
      description: Receive errors count
      type: Integer
      availability: May be empty

    tx_errors:
      description: Transmit errors count
      type: Integer
      availability: May be empty
