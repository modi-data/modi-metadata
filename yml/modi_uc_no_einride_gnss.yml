  summary: Single CSV file.
  file_format: csv with ',' as delimiter, '.' as decimal separator.
  file_structure: Single CSV file with header row. Each row represents one measurement from one device.
  required_tools: CSV parser (Excel, Python, R, etc.)
  tool_versions: N/A

# 5.3.1 Descriptive metadata
descriptive:
  fields:
    id:
      description: Identifier field (empty in this dataset)
      availability: Empty for all rows

    time:
      description: System timestamp when the position was recorded
      time_format: ISO 8601 (YYYY-MM-DD HH:MM:SS.ffffff UTC)
      time_zone: UTC

    sensor_time:
      description: GNSS sensor timestamp
      time_format: ISO 8601 (YYYY-MM-DD HH:MM:SS.f UTC)
      time_zone: UTC

    reference_frame:
      description: Reference frame for the GNSS sensor position on vehicle

    solution_type:
      description: Type of GNSS positioning solution

    latitude_degrees:
      description: Latitude coordinate (WGS84)
      unit: degrees
      srid: 4326

    longitude_degrees:
      description: Longitude coordinate (WGS84)
      unit: degrees
      srid: 4326

    heading_radians:
      description: Vehicle heading/bearing
      unit: radians
      availability: May be empty for some rows

    altitude_meters:
      description: Altitude above WGS84 ellipsoid
      unit: meters
      availability: May be empty for some rows

    horizontal_accuracy_meters:
      description: Estimated horizontal position accuracy (1-sigma)
      unit: meters

    vertical_accuracy_meters:
      description: Estimated vertical position accuracy (1-sigma)
      unit: meters

    hdop:
      description: Horizontal Dilution of Precision - geometric quality factor for horizontal position
      type: Float
      definition: Lower values indicate better geometric satellite configuration for horizontal positioning

    vdop:
      description: Vertical Dilution of Precision - geometric quality factor for vertical position
      type: Float
      definition: Lower values indicate better geometric satellite configuration for vertical positioning

    pdop:
      description: Position Dilution of Precision - geometric quality factor for 3D position
      type: Float
      definition: Lower values indicate better overall geometric satellite configuration

    tdop:
      description: Time Dilution of Precision - geometric quality factor for time solution
      type: Float
      definition: Lower values indicate better time solution quality

    gdop:
      description: Geometric Dilution of Precision - overall geometric quality factor
      type: Float
      definition: Lower values indicate better overall satellite geometry

    visible_satellites_count:
      description: Number of satellites visible and used in position solution
      type: Integer

